services:
  backend:
    build: ./server
    ports:
      - "8000:8000"
    env_file: ./server/.env
    volumes:
      - backend_db:/app/db
      - backend_media:/app/media
    environment:
      - SQLITE_PATH=/app/db/db.sqlite3
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No host port — host 6379 is taken by a local redis-server.
    # Backend reaches this service via the compose network as `redis:6379`.
    restart: unless-stopped

volumes:
  backend_db:
  backend_media:
